name: Build Caddy Image

on:
  push:
  schedule:
    - cron: "0 3 * * 1"   # weekly rebuild
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/caddy-customised:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/caddy-customised:latest
